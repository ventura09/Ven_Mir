<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ven-mir · panel</title>
  <!-- Sin icono, el navegador pide /favicon.ico y genera un 404 en consola que
       no significa nada y acaba ocultando los errores de verdad. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <meta name="description" content="Panel de gestion de ven-mir, generado por el sistema multi-agente.">
</head>
<body>
  <header class="topbar">
    <h1>ven-mir</h1>
    <p class="subtitle">API REST de tareas y usuarios</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Crear elemento</h2>
      <form id="create-form" novalidate>
        <div class="field">
          <label for="resource-select">Recurso</label>
          <select id="resource-select" name="resource">
            <option value="tasks">tasks</option>
            <option value="users">users</option>
          </select>
        </div>

        <div class="field">
          <label for="item-name">Nombre</label>
          <input id="item-name" name="name" type="text" autocomplete="off"
                 placeholder="Escribe un nombre" maxlength="200" required>
        </div>

        <div class="actions">
          <button id="submit" type="submit" class="primary">Crear</button>
          <button id="refresh" type="button" class="ghost">Recargar</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-heading">
      <h2 id="list-heading">Elementos</h2>

      <p id="status" class="status" role="status" aria-live="polite" data-kind="info">Cargando...</p>

      <p id="empty-state" class="empty" hidden>
        Todavia no hay elementos. Crea el primero con el formulario.
      </p>

      <ul id="item-list" class="item-list"></ul>
    </section>
  </main>

  <footer class="footer">
    <p>Generado por el sistema multi-agente. Los datos se guardan en el motor configurado en <code>STORAGE_DRIVER</code>.</p>
  </footer>

  <script type="module" src="/app.mjs"></script>
</body>
</html>
